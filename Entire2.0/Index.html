<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Fetcher</title>
    <link rel="stylesheet" href="style.css" />
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="card-title text-center">Upload and Execute JavaScript File</h1>
            <div class="form-group">
                <input type="file" id="fileInput" class="form-control" accept=".js">
            </div>
            <button class="btn btn-primary btn-block" onclick="uploadAndRun()">Run JS</button>
        </div>
    </div>
    <div class="card">
        <h1>API Fetcher</h1>
        <input type="text" id="apiName" placeholder="Enter API Name" />
        <input type="text" id="apiEndpoint" placeholder="Enter API Endpoint" />
        <button id="createCard">Create</button>
    </div>
    <div id="cardsContainer" class="row" style="width:100%"></div>
    <script defer src="script.js"></script>
    <script defer src="script2.js"></script>
</body>
</html>
